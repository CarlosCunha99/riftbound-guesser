name: Deploy release to Vercel

# Production always runs the latest full (non pre-release) GitHub release, with the newest card
# data and daily schedule from main (public/data) on top. So code only ships when you publish a
# release, while the nightly data refresh (refresh-cards.yml) can redeploy just the data.
# Pushes to main don't deploy to production (see vercel.json); pull requests still get previews.
on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: vercel-production
  cancel-in-progress: false

env:
  VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
  VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

jobs:
  deploy:
    # Pre-releases are skipped; publish a full release to go live.
    if: ${{ github.event_name == 'workflow_dispatch' || !github.event.release.prerelease }}
    runs-on: ubuntu-latest
    environment:
      name: production
      url: ${{ steps.deploy.outputs.url }}
    steps:
      - name: Resolve release tag
        id: tag
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          tag="$RELEASE_TAG"
          if [ -z "$tag" ]; then
            tag=$(gh release list --repo "$GITHUB_REPOSITORY" --exclude-drafts --exclude-pre-releases --limit 1 --json tagName --jq '.[0].tagName // empty')
          fi
          if [ -z "$tag" ]; then
            echo "::notice::No published (non pre-release) release yet, so there is nothing to deploy."
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v4
        if: steps.tag.outputs.tag != ''
        with:
          ref: ${{ steps.tag.outputs.tag }}
          fetch-depth: 0

      - name: Use the latest card data from main
        if: steps.tag.outputs.tag != ''
        run: git checkout origin/main -- public/data

      - uses: actions/setup-node@v4
        if: steps.tag.outputs.tag != ''
        with:
          node-version: 20
          cache: npm

      - name: Install and test
        if: steps.tag.outputs.tag != ''
        run: |
          npm ci
          npm test

      - name: Install Vercel CLI
        if: steps.tag.outputs.tag != ''
        run: npm install --global vercel@latest

      - name: Pull Vercel project settings
        if: steps.tag.outputs.tag != ''
        run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}

      - name: Build
        if: steps.tag.outputs.tag != ''
        run: vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}

      - name: Deploy to production
        id: deploy
        if: steps.tag.outputs.tag != ''
        run: |
          url=$(vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }})
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "Deployed ${{ steps.tag.outputs.tag }} with data from main to $url" >> "$GITHUB_STEP_SUMMARY"